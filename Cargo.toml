[package]
name = "l1j-launcher"
version = "0.1.0"
edition = "2021"
description = "天堂1 客户端更新器：清单校验 → 只下差异条目 → 合并进 Text.pak → 启动游戏"
license = "MIT"

[lib]
name = "l1j_launcher"
path = "src/lib.rs"
doctest = false

[[bin]]
name = "l1j-launcher"
path = "src/bin/l1j-launcher.rs"

[[bin]]
name = "l1sign"
path = "src/bin/l1sign.rs"

[dependencies]
l1pak = { path = "crates/l1pak" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand_core = { version = "0.6", features = ["getrandom"] }

[profile.release]
opt-level = "z"
lto = true
strip = "symbols"
codegen-units = 1
